[package]
name = "rusty-hourglass"
version = "0.1.0"
edition = "2021"
description = "A world that remembers: an append-only history, a derived state, and rules a model cannot break."
license = "MIT"
repository = "https://github.com/eserilev/rusty-hourglass"

# The library keeps the short name, so callers write `use hourglass::*`.
[lib]
name = "hourglass"
crate-type = ["lib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(charon)"] }

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
