[package]
name = "hourglass"
version = "0.1.0"
edition = "2021"
description = "A world that remembers: an append-only history, a derived state, and rules a model cannot break."
license = "MIT"

[lib]
crate-type = ["lib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
